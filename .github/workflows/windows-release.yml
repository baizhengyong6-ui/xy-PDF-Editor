# 在 Windows 上运行测试并打包便携版 exe。
# 推送 v* 标签时，把 exe 附加到 GitHub Release。
# 拉取请求和手动运行只上传构建产物，不创建 Release。

name: Windows 构建

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 运行测试
        run: pytest

  build-windows:
    name: 打包 Windows 程序
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 运行测试
        run: pytest
      - name: 打包便携版
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name XinyaoPDFEditor --icon assets/app.ico --collect-all pymupdf --collect-all PySide6 --collect-all PIL main.py
      - name: 确认程序可以启动
        run: .\dist\XinyaoPDFEditor.exe --self-check
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: XinyaoPDFEditor-windows-x64
          path: dist/XinyaoPDFEditor.exe
          if-no-files-found: error
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/XinyaoPDFEditor.exe
          generate_release_notes: true
