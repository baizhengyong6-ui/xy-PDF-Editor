# Ubuntu 与 macOS 上运行测试，并在 Windows、Apple Silicon、Intel 上打包。
# 推送 v* 标签时，把 exe 和两个 dmg 一起附加到 GitHub Release。
# 拉取请求和手动运行只上传构建产物，不创建 Release。

name: 构建与发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: 测试 (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 运行测试
        run: pytest

  build-windows:
    name: 打包 Windows 程序
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 运行测试
        run: pytest
      - name: 打包便携版
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name XinyaoPDFEditor --icon assets/app.ico --collect-all pymupdf --collect-all PySide6 --collect-all PIL main.py
      - name: 确认程序可以启动
        run: .\dist\XinyaoPDFEditor.exe --self-check
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: XinyaoPDFEditor-windows-x64
          path: dist/XinyaoPDFEditor.exe
          if-no-files-found: error

  build-macos:
    name: 打包 macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 运行测试
        run: pytest
      - name: 打包磁盘映像
        run: bash scripts/package_macos.sh
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: XinyaoPDFEditor-macos-${{ matrix.arch }}
          path: dist/XinyaoPDFEditor-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v7
        with:
          pattern: XinyaoPDFEditor-*
          merge-multiple: true
          path: release-assets
      - name: 核对文件
        run: |
          ls -lh release-assets
          test -f release-assets/XinyaoPDFEditor.exe
          test -f release-assets/XinyaoPDFEditor-macos-arm64.dmg
          test -f release-assets/XinyaoPDFEditor-macos-x86_64.dmg
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/XinyaoPDFEditor.exe
            release-assets/XinyaoPDFEditor-macos-arm64.dmg
            release-assets/XinyaoPDFEditor-macos-x86_64.dmg
          generate_release_notes: true
